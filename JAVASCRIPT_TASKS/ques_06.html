<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

let arr = [5, 8, 3, 7, 4, 6, 2];

let evenCount = 0;
let oddCount = 0;

let i = 0;

while (i < arr.length) {

    if (arr[i] % 2 == 0) {
        evenCount++;
    }
    else {
        oddCount++;
    }

    i++;
}

console.log("Even Count = " + evenCount);
console.log("Odd Count = " + oddCount);

</script>
</body>
</html>
