<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

let num = 12321;
let original = num;
let rev = 0;

while (num > 0) {

    let rem = num % 10;

    rev = rev * 10 + rem;

    num = Math.floor(num / 10);
}

if (original == rev) {
    console.log("Palindrome Number");
}
else {
    console.log("Not Palindrome Number");
}

</script>
</body>
</html>
